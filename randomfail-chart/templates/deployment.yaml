{{- $usePvc := eq .Values.volume.type "pvc" }}
{{- $pvcShared := has "ReadWriteMany" .Values.pvc.accessModes }}
{{- if not (has .Values.volume.type (list "pvc" "emptyDir")) }}
{{- fail (printf "volume.type muss 'pvc' oder 'emptyDir' sein, nicht '%s'" .Values.volume.type) }}
{{- end }}
{{- if and $usePvc (not $pvcShared) (gt (int .Values.replicaCount) 1) }}
{{- fail "replicaCount > 1 mit einem RWO-PVC führt zu Multi-Attach-Fehlern: pvc.accessModes auf ReadWriteMany oder volume.type auf emptyDir setzen" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and $usePvc (not $pvcShared) }}
  # RWO-Volume: alter Pod muss das Volume freigeben, bevor der neue startet
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
        {{- if eq .Values.ingress.controller "istio" }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      {{- if kindIs "invalid" .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ add .Values.chaos.sigtermDelay .Values.terminationGraceBuffer }}
      {{- else }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.topologySpread.enabled (gt (int .Values.replicaCount) 1) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ .Values.deploymentName }}
      {{- end }}
      containers:
        - name: {{ .Values.deploymentName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CHAOS_ENABLED
              value: {{ .Values.chaos.enabled | toString | quote }}
            - name: CHAOS_INTERVAL
              value: {{ .Values.chaos.interval | int | quote }}
            - name: CHAOS_STARTUP_DELAY
              value: {{ .Values.chaos.startupDelay | int | quote }}
            - name: MEMORY_CHUNK_SIZE
              value: {{ .Values.chaos.memoryChunkSize | int | quote }}
            - name: DISK_FILL_SIZE_MB
              value: {{ .Values.chaos.diskFillSizeMB | int | quote }}
            - name: CPU_BURN_WORKERS
              value: {{ .Values.chaos.cpuBurnWorkers | int | quote }}
            - name: CPU_BURN_DURATION
              value: {{ .Values.chaos.cpuBurnDuration | int | quote }}
            - name: SLOW_RESPONSE_DELAY
              value: {{ .Values.chaos.slowResponseDelay | int | quote }}
            - name: SLOW_AFFECTS_PROBES
              value: {{ .Values.chaos.slowAffectsProbes | toString | quote }}
            - name: SIGTERM_DELAY
              value: {{ .Values.chaos.sigtermDelay | int | quote }}
            - name: READINESS_FLAP_INTERVAL
              value: {{ .Values.chaos.readinessFlapInterval | int | quote }}
            - name: FD_EXHAUSTION_LIMIT
              value: {{ .Values.chaos.fdExhaustionLimit | int | quote }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.targetPort }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: {{ .Values.volume.mountPath }}
      volumes:
        - name: tmp-volume
          {{- if $usePvc }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
          {{- else }}
          emptyDir:
            {{- with .Values.volume.emptyDir.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with .Values.volume.emptyDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
