<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FastAPI Fastfail</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="card">
        <header class="card-header">
            <h1>FastAPI Fastfail</h1>
            <span class="badge {{ 'badge-on' if CHAOS_ENABLED else 'badge-off' }}">
                Chaos {{ 'aktiv' if CHAOS_ENABLED else 'deaktiviert' }}
            </span>
        </header>

        <section class="stats">
            <div class="stat">
                <span class="stat-label">Aktuelle Uhrzeit</span>
                <span class="stat-value">{{ TIME }}</span>
            </div>
            <div class="stat">
                <span class="stat-label">Aktuelles Szenario</span>
                <span class="stat-value stat-scenario">{{ SCENARIO }}</span>
            </div>
        </section>

        <!-- GET Endpoints -->
        <section class="group">
            <h2>Endpoints</h2>
            <div class="actions">
                <form action="/healthz" method="get">
                    <button class="btn">/healthz</button>
                </form>
                <form action="/readyz" method="get">
                    <button class="btn">/readyz</button>
                </form>
                <form action="/status" method="get">
                    <button class="btn">/status</button>
                </form>
            </div>
        </section>

        <!-- POST Chaos Endpoints -->
        <section class="group">
            <h2>Chaos</h2>
            <div class="actions">
                {% if CHAOS_ENABLED %}
                <form action="/chaos/cpu" method="post">
                    <button class="btn">CPU Chaos</button>
                </form>
                <form action="/chaos/oom" method="post">
                    <button class="btn">OOM Chaos</button>
                </form>
                <form action="/chaos/disk" method="post">
                    <button class="btn">Disk Fill</button>
                </form>
                {% endif %}
                <form action="/chaos/unhealthy" method="post">
                    <button class="btn">Toggle Unhealthy</button>
                </form>
                <form action="/chaos/reset" method="post">
                    <button class="btn btn-success">Reset Chaos</button>
                </form>
                <form action="/chaos/crash" method="post">
                    <button class="btn btn-danger">Crash</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
